<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10231d">
<title>Tính tiền banh</title>
<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#f4f7f5, #101714);
  --surface: light-dark(#ffffff, #1a2420);
  --surface-soft: light-dark(#edf4ef, #202e27);
  --text: light-dark(#17231c, #f0f6f1);
  --muted: light-dark(#68766d, #a5b4aa);
  --border: light-dark(#dce5de, #34443a);
  --green: light-dark(#16794b, #6dd69c);
  --green-dark: light-dark(#105d39, #163c29);
  --red: light-dark(#b74b3d, #ff9d8f);
  --shadow: 0 12px 32px rgba(16, 35, 29, .08);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.app { min-height: 100vh; width: 100%; background: var(--bg); padding: 6px 16px 36px; }
.wrap { width: 100%; max-width: 560px; margin: 0 auto; }
header { padding: 8px 2px 22px; }
.eyebrow { display: inline-flex; align-items: center; gap: 7px; color: var(--green); font-size: 12px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
h1 { margin: 10px 0 7px; font-size: clamp(28px, 7vw, 38px); line-height: 1.08; letter-spacing: -.04em; }
.subtitle { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 20px; box-shadow: var(--shadow); }
.field { margin-bottom: 19px; }
.field:last-child { margin-bottom: 0; }
label, .field-label { display: block; font-size: 13px; font-weight: 750; margin-bottom: 8px; }
.input-wrap { position: relative; }
input[type="text"], input[type="number"] { width: 100%; appearance: none; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 13px; min-height: 52px; padding: 13px 14px; font: inherit; font-size: 17px; font-weight: 650; outline: none; }
input:focus { border-color: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 17%, transparent); }
.suffix { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
input#cost { padding-right: 54px; }
.people-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.counter { display: grid; grid-template-columns: 42px 1fr 42px; gap: 5px; align-items: center; background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 5px; }
.counter button { border: 0; background: var(--surface-soft); color: var(--text); width: 40px; height: 40px; border-radius: 10px; font-size: 22px; cursor: pointer; }
.counter input { border: 0; box-shadow: none; background: transparent; padding: 5px 0; text-align: center; min-height: 40px; width: 100%; font-size: 21px; }
.diff-row { display: flex; gap: 10px; align-items: center; }
.diff-row input { flex: 1; min-width: 0; }
.presets { display: flex; gap: 7px; margin-top: 9px; flex-wrap: wrap; }
.preset { border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 7px 11px; font-size: 12px; font-weight: 700; cursor: pointer; }
.preset.active { background: var(--surface-soft); color: var(--green); border-color: var(--green); }
.result { margin-top: 16px; background: var(--green-dark); border-radius: 22px; padding: 20px; color: light-dark(#f4fff7, #effff4); }
.result-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 15px; }
.result-heading h2 { font-size: 16px; margin: 0; }
.pill { font-size: 11px; font-weight: 800; padding: 6px 9px; border: 1px solid rgba(255,255,255,.22); border-radius: 999px; white-space: nowrap; }
.fees { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fee-card { background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.13); border-radius: 15px; padding: 14px 12px; min-width: 0; }
.fee-label { font-size: 12px; opacity: .83; margin-bottom: 8px; }
.fee-amount { font-size: clamp(22px, 6vw, 29px); font-weight: 850; letter-spacing: -.04em; line-height: 1.1; overflow-wrap: anywhere; }
.fee-detail { font-size: 11px; opacity: .72; margin-top: 8px; }
.math-note { margin: 14px 0 0; font-size: 12px; line-height: 1.5; opacity: .82; }
.warning { display: none; background: light-dark(#fff0ec, #3a211d); color: var(--red); border: 1px solid color-mix(in srgb, var(--red) 40%, transparent); border-radius: 13px; padding: 12px; margin-top: 13px; font-size: 13px; line-height: 1.45; }
.warning.show { display: block; }
.actions { display: grid; grid-template-columns: 1fr auto; gap: 9px; margin-top: 14px; }
.primary, .secondary { border-radius: 13px; min-height: 48px; padding: 12px 15px; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; }
.primary { border: 0; background: var(--green); color: white; }
.secondary { border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.tip { color: var(--muted); font-size: 12px; line-height: 1.55; padding: 14px 3px 0; }
footer { color: var(--muted); font-size: 11px; text-align: center; padding-top: 24px; }
@media (max-width: 360px) { .panel { padding: 15px; } .fees { grid-template-columns: 1fr; } .fee-amount { font-size: 28px; } }
</style>
</head>
<body>
<main class="app">
  <div class="wrap">
    <header>
      <div class="eyebrow">⚽ Công cụ tính tiền đá banh</div>
      <!--<h1>Tính tiền đá banh</h1>-->
    </header>
    <section class="panel" aria-label="Thông tin trận đấu">
      <div class="field">
        <label for="cost">Tổng tiền sân</label>
        <div class="input-wrap"><input id="cost" type="number" inputmode="numeric" min="1" step="1" placeholder="Nhập tiền sân" autocomplete="off"><span class="suffix">k</span></div>
      </div>
      <div class="field">
        <div class="people-grid">
          <div>
            <label for="winners">Số người đội thắng</label>
            <div class="counter"><button type="button" data-step="winners" data-delta="-1" aria-label="Giảm số người đội thắng">−</button><input id="winners" type="number" inputmode="numeric" min="1" max="99" value="5"><button type="button" data-step="winners" data-delta="1" aria-label="Tăng số người đội thắng">+</button></div>
          </div>
          <div>
            <label for="losers">Số người đội thua</label>
            <div class="counter"><button type="button" data-step="losers" data-delta="-1" aria-label="Giảm số người đội thua">−</button><input id="losers" type="number" inputmode="numeric" min="1" max="99" value="5"><button type="button" data-step="losers" data-delta="1" aria-label="Tăng số người đội thua">+</button></div>
          </div>
        </div>
      </div>
      <div class="field">
        <label>Mức chênh lệch mỗi người</label>
        <div class="people-grid">
          <div>
            <label for="minDiff">Tối thiểu</label>
            <div class="counter">
              <button type="button" data-step="minDiff" data-delta="-1" aria-label="Giảm mức chênh lệch tối thiểu">−</button>
              <input id="minDiff" type="number" inputmode="numeric" min="0" max="20" step="1" value="11">
              <button type="button" data-step="minDiff" data-delta="1" aria-label="Tăng mức chênh lệch tối thiểu">+</button>
            </div>
          </div>
          <div>
            <label for="maxDiff">Tối đa</label>
            <div class="counter">
              <button type="button" data-step="maxDiff" data-delta="-1" aria-label="Giảm mức chênh lệch tối đa">−</button>
              <input id="maxDiff" type="number" inputmode="numeric" min="10" max="100" step="1" value="13">
              <button type="button" data-step="maxDiff" data-delta="1" aria-label="Tăng mức chênh lệch tối đa">+</button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="actions"><button class="primary" id="copyBtn" type="button">Sao chép kết quả</button><button class="secondary" id="resetBtn" type="button">Đặt lại</button></div>
    <section class="result" aria-live="polite" aria-label="Kết quả chia tiền">
      <div class="result-heading"><h2>Kết quả chia tiền</h2><span class="pill" id="totalPill">Nhập tiền sân</span></div>
      <div class="fees">
        <div class="fee-card"><div class="fee-label">🟢 Mỗi người đội thắng</div><div class="fee-amount" id="winFee">—</div><div class="fee-detail" id="winDetail">Nhập tiền sân để tính</div></div>
        <div class="fee-card"><div class="fee-label">🔴 Mỗi người đội thua</div><div class="fee-amount" id="loseFee">—</div><div class="fee-detail" id="loseDetail">Nhập tiền sân để tính</div></div>
      </div>
      <p class="math-note" id="mathNote">Nhập tổng tiền sân để xem kết quả.</p>
    </section>
    <div class="warning" id="warning" role="status"></div>
    <footer>©Author: hieuvv.qni@vnpt.vn</footer>
  </div>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const costInput = $('cost');
  const winnersInput = $('winners');
  const losersInput = $('losers');
  const minDiffInput = $('minDiff');
  const maxDiffInput = $('maxDiff');
  const warning = $('warning');
  const format = (n) => Math.round(n).toLocaleString('vi-VN') + 'k';
  const parseCost = () => Math.floor(Number(costInput.value)) || 0;

  function calculate() {
    const cost = parseCost();
    const nw = Math.floor(Number(winnersInput.value));
    const nl = Math.floor(Number(losersInput.value));
    const minDiff = Math.floor(Number(minDiffInput.value));
    const maxDiff = Math.floor(Number(maxDiffInput.value));
    warning.classList.remove('show');
    warning.textContent = '';
    if (!cost || !Number.isFinite(cost) || !Number.isFinite(nw) || !Number.isFinite(nl) || nw < 1 || nl < 1 || nw > 99 || nl > 99 || !Number.isFinite(minDiff) || !Number.isFinite(maxDiff) || minDiff < 0 || maxDiff < minDiff || maxDiff > 100) {
      warning.textContent = 'Vui lòng nhập tổng tiền sân hợp lệ, số người mỗi đội từ 1 đến 99 và mức chênh lệch hợp lệ (tối thiểu không vượt quá tối đa, tối đa không quá 100k).';
      warning.classList.add('show');
      $('winFee').textContent = '—'; $('loseFee').textContent = '—';
      $('winDetail').textContent = 'Kiểm tra lại dữ liệu'; $('loseDetail').textContent = 'Kiểm tra lại dữ liệu';
      $('totalPill').textContent = 'Chưa có kết quả'; $('mathNote').textContent = '';
      return null;
    }
    let best = null;
    for (let d = minDiff; d <= maxDiff; d++) {
      const w = Math.max(0, Math.ceil((cost - nl * d) / (nw + nl)));
      const l = w + d;
      const collected = nw * w + nl * l;
      const candidate = {w, l, d, collected, surplus: collected - cost};
      if (!best || candidate.surplus < best.surplus || (candidate.surplus === best.surplus && candidate.d > best.d)) best = candidate;
    }
    const winFee = best.w;
    const loseFee = best.l;
    const diff = best.d;
    const wt = winFee * nw;
    const lt = loseFee * nl;
    $('winFee').textContent = format(winFee);
    $('loseFee').textContent = format(loseFee);
    $('winDetail').textContent = `${nw} người · tổng ${format(wt)}`;
    $('loseDetail').textContent = `${nl} người · tổng ${format(lt)}`;
    $('totalPill').textContent = `Tổng ${format(cost)}`;
    $('mathNote').textContent = `Chênh lệch thực tế ${format(diff)}/người (cho phép ${format(minDiff)}–${format(maxDiff)}). Tổng thu ${format(best.collected)}, dư ${format(best.surplus)}.`;
    return {cost, nw, nl, diff, winFee, loseFee, wt, lt, collected: best.collected, surplus: best.surplus};
  }
  costInput.addEventListener('input', calculate);
  [winnersInput, losersInput, minDiffInput, maxDiffInput].forEach(el => el.addEventListener('input', calculate));
  document.querySelectorAll('[data-step]').forEach(btn => btn.addEventListener('click', () => {
    const input = $(btn.dataset.step);
    const current = Number(input.value) || 1;
    input.value = Math.min(99, Math.max(1, current + Number(btn.dataset.delta)));
    calculate();
  }));
  $('copyBtn').addEventListener('click', async () => {
    const r = calculate();
    if (!r) return;
    const text = `💸 KẾT QUẢ CHIA TIỀN SÂN\nTổng tiền sân: ${format(r.cost)}\nĐội thắng (${r.nw} người): ${format(r.winFee)}\nĐội thua (${r.nl} người): ${format(r.loseFee)}\nChênh lệch thắng/thua: ${format(r.diff)}`;
    const btn = $('copyBtn');
    try { await navigator.clipboard.writeText(text); btn.textContent = 'Đã sao chép ✓'; }
    catch (_) {
      const area = document.createElement('textarea'); area.value = text; document.body.appendChild(area); area.select();
      try { document.execCommand('copy'); btn.textContent = 'Đã sao chép ✓'; } catch (e) { btn.textContent = 'Không sao chép được'; }
      area.remove();
    }
    setTimeout(() => btn.textContent = 'Sao chép kết quả', 1800);
  });
  $('resetBtn').addEventListener('click', () => { costInput.value = ''; winnersInput.value = 5; losersInput.value = 5; minDiffInput.value = 11; maxDiffInput.value = 13; calculate(); });
  calculate();
})();
</script>
</body>
</html>
